<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Как сохранять проект Revit</title><desc id="desc">Рабочий RVT сохраняется через Ctrl S, перед экспериментами создаётся копия, после пары файл переносится в резервное хранилище.</desc>
<defs><style>.bg{fill:#f4f6ee}.card{fill:#fffefa;stroke:#cbd9ca;stroke-width:3}.ink{fill:#193e34}.muted{fill:#6c8276}.accent{fill:#bd5938}.soft{fill:#e8efe2}.warn{fill:#f7e8df}.line{stroke:#193e34;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.arrow{stroke:#bd5938;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}.h{font:700 36px system-ui,sans-serif}.t{font:500 22px system-ui,sans-serif}.s{font:700 24px system-ui,sans-serif}.key{font:750 28px ui-monospace,monospace}</style></defs>
<rect class="bg" width="1200" height="675" rx="28"/>
<text class="ink h" x="60" y="72">Сохранение, которое реально спасает</text><text class="muted t" x="60" y="112">Три действия. Ни одно из них не называется «надеяться, что компьютер не выключат».</text>
<g transform="translate(55 190)"><rect class="card" width="300" height="330" rx="24"/><rect class="soft" x="25" y="25" width="250" height="100" rx="18"/><path class="line" d="M104 47h94l34 34v112H104zM124 47v51h72V47M137 137h62"/><text class="ink s" x="35" y="180">Рабочий RVT</text><text class="muted t" x="35" y="220">Понятное имя и</text><text class="muted t" x="35" y="252">своя папка курса.</text><rect class="warn" x="35" y="275" width="230" height="38" rx="9"/><text class="accent key" x="78" y="304">Ctrl + S</text></g>
<path class="arrow" d="M375 355h90m-22-20 22 20-22 20"/>
<g transform="translate(480 190)"><rect class="card" width="300" height="330" rx="24"/><rect class="soft" x="25" y="25" width="250" height="100" rx="18"/><path class="line" d="M87 62h98l28 28v110H87zM120 47h98l28 28v110h-20M185 62v42h42"/><text class="ink s" x="35" y="180">Копия перед опытом</text><text class="muted t" x="35" y="220">Save As перед тем,</text><text class="muted t" x="35" y="252">как ломать модель.</text><text class="accent s" x="35" y="303">И это нормально.</text></g>
<path class="arrow" d="M800 355h90m-22-20 22 20-22 20"/>
<g transform="translate(905 190)"><rect class="card" width="240" height="330" rx="24"/><rect class="soft" x="25" y="25" width="190" height="100" rx="18"/><path class="line" d="M66 105c-17-1-26-11-26-26 0-17 12-28 29-28 8-19 25-29 47-29 28 0 48 17 52 42 18 1 31 14 31 31 0 18-14 31-34 31H66zM120 68v72m-25-25 25 25 25-25"/><text class="ink s" x="30" y="180">Резервная копия</text><text class="muted t" x="30" y="220">После пары перенеси</text><text class="muted t" x="30" y="252">файл туда, откуда</text><text class="muted t" x="30" y="284">его можно вернуть.</text></g>
<text class="accent s" x="60" y="590">Напоминание о сохранении ≠ автосохранение</text><text class="muted t" x="60" y="625">Revit может напомнить. Нажать «Сохранить» всё равно должен человек. Трагедия, конечно.</text>
</svg>
