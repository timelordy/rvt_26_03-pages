<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Семейства, типоразмеры и экземпляры Revit</title><desc id="desc">Слева системные семейства, справа загружаемые, снизу пример цепочки семейство, типоразмер и экземпляр.</desc>
<defs><style>.bg{fill:#f4f6ee}.card{fill:#fffefa;stroke:#cbd9ca;stroke-width:3}.ink{fill:#193e34}.muted{fill:#6c8276}.accent{fill:#bd5938}.green{fill:#e8efe2}.blue{fill:#e4eef3}.sand{fill:#f5eadf}.line{stroke:#193e34;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.arrow{stroke:#bd5938;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.h{font:700 35px system-ui,sans-serif}.t{font:500 21px system-ui,sans-serif}.s{font:700 24px system-ui,sans-serif}.xs{font:650 17px system-ui,sans-serif}</style></defs>
<rect class="bg" width="1200" height="675" rx="28"/>
<text class="ink h" x="60" y="70">Семейство — не всегда отдельный файл</text><text class="muted t" x="60" y="108">Стены живут в проекте. Двери и окна часто приходят из .RFA. Люди назвали всё одним словом, чтобы новичку было веселее.</text>
<g transform="translate(60 150)"><rect class="card" width="505" height="270" rx="24"/><rect class="green" x="25" y="25" width="455" height="62" rx="14"/><text class="ink s" x="48" y="66">Системные семейства</text><path class="line" d="M55 213h115v-80H55zM75 133v80M105 133v80M135 133v80"/><path class="line" d="M215 213h115v-80H215zM215 165h115"/><path class="line" d="M375 213h90M385 213v-62l35-28 35 28v62"/><text class="muted xs" x="72" y="244">стены</text><text class="muted xs" x="226" y="244">перекрытия</text><text class="muted xs" x="393" y="244">крыши</text></g>
<g transform="translate(635 150)"><rect class="card" width="505" height="270" rx="24"/><rect class="blue" x="25" y="25" width="455" height="62" rx="14"/><text class="ink s" x="48" y="66">Загружаемые семейства .RFA</text><path class="line" d="M55 213v-90h82v90M72 213v-62h48v62M95 180h2"/><path class="line" d="M205 213v-90h105v90M233 165h20v25h-20zM268 165h20v25h-20z"/><path class="line" d="M372 213v-60h85v60M385 153v-35h60v35M397 213v-38h35v38"/><text class="muted xs" x="77" y="244">двери</text><text class="muted xs" x="231" y="244">окна</text><text class="muted xs" x="388" y="244">мебель</text></g>
<g transform="translate(60 475)"><rect class="sand" width="1080" height="135" rx="22"/><g transform="translate(35 25)"><rect class="card" width="275" height="85" rx="15"/><text class="accent xs" x="22" y="32">СЕМЕЙСТВО</text><text class="ink s" x="22" y="65">Одинарная дверь</text></g><path class="arrow" d="M330 68h70m-18-17 18 17-18 17"/><g transform="translate(420 25)"><rect class="card" width="275" height="85" rx="15"/><text class="accent xs" x="22" y="32">ТИПОРАЗМЕР</text><text class="ink s" x="22" y="65">900 × 2100</text></g><path class="arrow" d="M715 68h70m-18-17 18 17-18 17"/><g transform="translate(805 25)"><rect class="card" width="240" height="85" rx="15"/><text class="accent xs" x="22" y="32">ЭКЗЕМПЛЯР</text><text class="ink s" x="22" y="65">Дверь спальни</text></g></g>
</svg>
