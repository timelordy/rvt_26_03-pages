<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Маршрут курса Revit</title><desc id="desc">Один проект проходит путь от основы и модели дома к проверенным видам и двум листам PDF.</desc><defs><style>.bg{fill:#f4f6ee}.card{fill:#fffefa;stroke:#cbd9ca;stroke-width:3}.ink{fill:#193e34}.muted{fill:#61796d}.accent{fill:#bd5938}.green{fill:#e7efe2}.blue{fill:#e4eef3}.sand{fill:#f5eadf}.line{stroke:#193e34;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.dash{stroke:#91a98f;stroke-width:6;fill:none;stroke-linecap:round;stroke-dasharray:12 15}.h{font:700 40px system-ui,sans-serif}.s{font:700 26px system-ui,sans-serif}.t{font:500 21px system-ui,sans-serif}.n{font:800 30px system-ui,sans-serif}</style></defs><rect class="bg" width="1200" height="675" rx="28"/><text class="ink h" x="60" y="72">Один дом на весь семестр</text><text class="muted t" x="60" y="112">Не заводим новый файл ради каждой темы. Постепенно доводим один RVT до нормального результата.</text><path class="dash" d="M175 340h850"/><g transform="translate(50 170)"><rect class="card" width="300" height="350" rx="24"/><circle class="blue" cx="55" cy="55" r="30"/><text class="accent n" x="55" y="66" text-anchor="middle">1</text><text class="ink s" x="30" y="120">Основа проекта</text><text class="muted t" x="30" y="165">Шаблон и сохранение</text><text class="muted t" x="30" y="200">Участок и DXF</text><text class="muted t" x="30" y="235">Оси и уровни</text><path class="line" d="M55 305h190M75 280v50M135 280v50M195 280v50"/></g><g transform="translate(450 170)"><rect class="card" width="300" height="350" rx="24"/><circle class="green" cx="55" cy="55" r="30"/><text class="accent n" x="55" y="66" text-anchor="middle">2</text><text class="ink s" x="30" y="120">Модель дома</text><text class="muted t" x="30" y="165">Стены и перекрытия</text><text class="muted t" x="30" y="200">Окна, двери, помещения</text><text class="muted t" x="30" y="235">Кровля и лестница</text><path class="line" d="M55 315V265h190v50M105 315v-80h90v80M130 315v-38h40v38"/></g><g transform="translate(850 170)"><rect class="card" width="300" height="350" rx="24"/><circle class="sand" cx="55" cy="55" r="30"/><text class="accent n" x="55" y="66" text-anchor="middle">3</text><text class="ink s" x="30" y="120">Понятный результат</text><text class="muted t" x="30" y="165">Проверенная модель</text><text class="muted t" x="30" y="200">Планы, разрез и фасады</text><text class="muted t" x="30" y="235">Два листа PDF</text><path class="line" d="M65 265h170v70H65zM85 285h70M85 305h120M85 325h95"/></g><rect class="green" x="260" y="570" width="680" height="55" rx="18"/><text class="ink s" x="600" y="606" text-anchor="middle">Финал: рабочий RVT + два понятных листа PDF</text></svg>