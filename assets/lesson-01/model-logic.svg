<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Логика модели Revit</title><desc id="desc">Объект модели имеет параметры и отображается на видах, которые размещают на листах.</desc><defs><style>.bg{fill:#f4f6ee}.card{fill:#fffefa;stroke:#cbd9ca;stroke-width:3}.ink{fill:#193e34}.muted{fill:#61796d}.accent{fill:#bd5938}.green{fill:#e7efe2}.blue{fill:#e4eef3}.sand{fill:#f5eadf}.line{stroke:#193e34;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.h{font:700 40px system-ui,sans-serif}.s{font:700 26px system-ui,sans-serif}.t{font:500 21px system-ui,sans-serif}.tag{font:700 18px system-ui,sans-serif}</style></defs><rect class="bg" width="1200" height="675" rx="28"/><text class="ink h" x="60" y="72">Как устроена одна модель Revit</text><text class="muted t" x="60" y="112">Объект хранится один раз. Параметры описывают его. Виды показывают его с нужной стороны.</text><g transform="translate(55 180)"><rect class="card" width="250" height="350" rx="24"/><rect class="green" x="24" y="24" width="202" height="128" rx="18"/><path class="line" d="M70 130V64h110v66M105 130V91h38v39"/><text class="accent tag" x="125" y="188" text-anchor="middle">ОБЪЕКТ</text><text class="ink s" x="125" y="224" text-anchor="middle">Дверь</text><text class="muted t" x="30" y="274">Один элемент</text><text class="muted t" x="30" y="307">в модели здания</text></g><path class="line" d="M325 355h75"/><path class="line" d="M380 335l20 20-20 20"/><g transform="translate(420 180)"><rect class="card" width="300" height="350" rx="24"/><text class="accent tag" x="150" y="55" text-anchor="middle">ПАРАМЕТРЫ</text><g transform="translate(28 85)"><rect class="sand" width="244" height="204" rx="18"/><text class="ink t" x="22" y="42">Тип: 900 × 2100</text><text class="ink t" x="22" y="82">Уровень: 1 этаж</text><text class="ink t" x="22" y="122">Материал: дерево</text><text class="ink t" x="22" y="162">Комментарий: спальня</text></g><text class="muted t" x="150" y="326" text-anchor="middle">Данные объекта</text></g><path class="line" d="M740 355h75"/><path class="line" d="M795 335l20 20-20 20"/><g transform="translate(835 180)"><rect class="card" width="310" height="350" rx="24"/><text class="accent tag" x="155" y="55" text-anchor="middle">ВИДЫ И ЛИСТЫ</text><g transform="translate(28 85)"><rect class="blue" width="115" height="90" rx="14"/><path class="line" d="M20 67h75V24H20zM53 24v43"/><text class="ink tag" x="57" y="118" text-anchor="middle">План</text></g><g transform="translate(167 85)"><rect class="green" width="115" height="90" rx="14"/><path class="line" d="M20 67h75V39L58 19 20 39z"/><text class="ink tag" x="57" y="118" text-anchor="middle">Фасад</text></g><text class="muted t" x="28" y="245">План, разрез, 3D,</text><text class="muted t" x="28" y="278">таблица и лист используют</text><text class="muted t" x="28" y="311">тот же объект и его данные.</text></g><rect class="green" x="225" y="570" width="750" height="55" rx="18"/><text class="ink s" x="600" y="606" text-anchor="middle">Это одна модель, а не несколько отдельных чертежей</text></svg>