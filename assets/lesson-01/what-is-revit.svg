<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Что такое Revit</title><desc id="desc">Revit собирает модель здания из объектов, а затем показывает её на планах, фасадах, разрезах и в 3D.</desc><defs><style>.bg{fill:#f4f6ee}.card{fill:#fffefa;stroke:#cbd9ca;stroke-width:3}.ink{fill:#193e34}.muted{fill:#61796d}.accent{fill:#bd5938}.soft{fill:#e7efe2}.blue{fill:#e4eef3}.line{stroke:#193e34;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.h{font:700 40px system-ui,sans-serif}.s{font:700 25px system-ui,sans-serif}.t{font:500 22px system-ui,sans-serif}.small{font:600 19px system-ui,sans-serif}</style></defs><rect class="bg" width="1200" height="675" rx="28"/><text class="ink h" x="60" y="72">Revit — модель здания, а не набор линий</text><text class="muted t" x="60" y="112">Ставим стены, двери и окна как объекты. Виды показывают одну и ту же модель.</text><g transform="translate(60 170)"><rect class="card" width="430" height="420" rx="24"/><text class="ink s" x="30" y="52">Объекты модели</text><rect class="soft" x="30" y="82" width="370" height="205" rx="18"/><path class="line" d="M85 238V125h225v113M85 238h270M150 238v-70h62v70M260 165h55v48h-55z"/><text class="accent small" x="30" y="330">Стена · дверь · окно · уровень</text><text class="muted t" x="30" y="370">У каждого объекта есть тип,</text><text class="muted t" x="30" y="402">размеры, материал и привязки.</text></g><path class="line" d="M525 380h105"/><path class="line" d="M610 360l20 20-20 20"/><g transform="translate(670 170)"><rect class="card" width="470" height="420" rx="24"/><text class="ink s" x="30" y="52">Виды этой же модели</text><g transform="translate(30 85)"><rect class="blue" width="190" height="120" rx="16"/><path class="line" d="M25 93h140V27H25zM70 27v66M116 27v66"/><text class="ink small" x="95" y="150" text-anchor="middle">План</text></g><g transform="translate(250 85)"><rect class="soft" width="190" height="120" rx="16"/><path class="line" d="M28 96h134V56l-67-35-67 35zM78 96V61h34v35"/><text class="ink small" x="95" y="150" text-anchor="middle">Фасад</text></g><text class="muted t" x="30" y="285">Разрез, 3D, таблица и лист тоже</text><text class="muted t" x="30" y="317">работают с этой же моделью.</text><rect class="soft" x="30" y="345" width="410" height="48" rx="14"/><text class="ink small" x="235" y="376" text-anchor="middle">Изменил объект → виды обновились</text></g></svg>