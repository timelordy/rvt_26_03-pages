<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Создание проекта Revit из шаблона</title><desc id="desc">Шаблон RTE со стартовыми настройками используется в окне создания, после чего появляется отдельный проект RVT.</desc>
<defs><style>.bg{fill:#f4f6ee}.card{fill:#fffefa;stroke:#cbd9ca;stroke-width:3}.ink{fill:#193e34}.muted{fill:#6c8276}.accent{fill:#bd5938}.green{fill:#e8efe2}.blue{fill:#e4eef3}.line{stroke:#193e34;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.arrow{stroke:#bd5938;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}.h{font:700 36px system-ui,sans-serif}.t{font:500 22px system-ui,sans-serif}.s{font:700 24px system-ui,sans-serif}.ext{font:800 45px system-ui,sans-serif}</style></defs>
<rect class="bg" width="1200" height="675" rx="28"/>
<text class="ink h" x="60" y="72">Шаблон не становится твоим домом</text><text class="muted t" x="60" y="112">Он только отдаёт проекту стартовые настройки. Дальше файлы живут отдельно.</text>
<g transform="translate(60 175)"><rect class="card" width="300" height="355" rx="24"/><rect class="green" x="25" y="25" width="250" height="95" rx="18"/><text class="accent ext" x="60" y="90">.RTE</text><text class="ink s" x="35" y="168">Шаблон курса</text><text class="muted t" x="35" y="210">• единицы</text><text class="muted t" x="35" y="247">• типы стен</text><text class="muted t" x="35" y="284">• виды и семейства</text><text class="muted t" x="35" y="321">• оформление</text></g>
<path class="arrow" d="M380 350h85m-22-20 22 20-22 20"/>
<g transform="translate(480 175)"><rect class="card" width="265" height="355" rx="24"/><text class="accent s" x="30" y="54">НОВЫЙ ПРОЕКТ</text><rect class="blue" x="30" y="78" width="205" height="70" rx="12"/><text class="ink t" x="48" y="119">Template file</text><rect class="green" x="30" y="170" width="205" height="70" rx="12"/><text class="ink t" x="48" y="211">Create new:</text><text class="accent s" x="48" y="238">Project</text><rect class="accent" x="69" y="276" width="127" height="49" rx="11"/><text fill="#fff" class="s" x="112" y="309">OK</text></g>
<path class="arrow" d="M765 350h85m-22-20 22 20-22 20"/>
<g transform="translate(865 175)"><rect class="card" width="275" height="355" rx="24"/><rect class="blue" x="25" y="25" width="225" height="95" rx="18"/><text class="accent ext" x="57" y="90">.RVT</text><path class="line" d="M63 235l74-67 75 67v73H63zM101 308v-63h49v63M172 308v-42h26v42"/><text class="ink s" x="35" y="348">Твой проект</text></g>
<rect x="60" y="570" width="1080" height="55" rx="14" fill="#fbf1e9"/><text class="accent s" x="90" y="605">После создания сохраняй как .RVT. Не выбирай «Project template», если тебе нужен обычный проект.</text>
</svg>
